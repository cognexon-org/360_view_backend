services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET_PRIVATE;
      mc mb --ignore-existing local/$$MINIO_BUCKET_PUBLIC;
      mc anonymous set download local/$$MINIO_BUCKET_PUBLIC;
      exit 0;
      "

  vision:
    build:
      context: ./services/vision-python
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}:${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_USE_SSL}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
      VISION_SHARED_SECRET: ${VISION_SHARED_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "8001:8001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./services/api-node
    command: sh -c "npx prisma db push && node dist/server.js"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      OTP_SECRET: ${OTP_SECRET}
      DEV_OTP_EXPOSE: ${DEV_OTP_EXPOSE}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PRESIGN_ENDPOINT: ${MINIO_PRESIGN_ENDPOINT}
      MINIO_PRESIGN_PORT: ${MINIO_PRESIGN_PORT}
      MINIO_PRESIGN_USE_SSL: ${MINIO_PRESIGN_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL}
      VISION_SHARED_SECRET: ${VISION_SHARED_SECRET}
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      vision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./services/api-node
    command: node dist/worker.js
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      OTP_SECRET: ${OTP_SECRET}
      DEV_OTP_EXPOSE: ${DEV_OTP_EXPOSE}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_PRESIGN_ENDPOINT: ${MINIO_PRESIGN_ENDPOINT}
      MINIO_PRESIGN_PORT: ${MINIO_PRESIGN_PORT}
      MINIO_PRESIGN_USE_SSL: ${MINIO_PRESIGN_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL}
      VISION_SHARED_SECRET: ${VISION_SHARED_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      vision:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
